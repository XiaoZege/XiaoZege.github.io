baseURL = "https://XiaoZege.github.io/"
title = "我的技术笔记"
theme = "PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录学习、实验与踩坑"
  author = "XiaoZege"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false

[params.homeInfoParams]
  Title = "你好，我是 XiaoZege"
  Content = "生物信息学在读，正在学 AI 应用工程。这里记录我的实验、踩坑和复盘。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/XiaoZege"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 20
